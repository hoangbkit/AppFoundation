name: Fast CI

on:
  push:

permissions:
  contents: read

jobs:
  package-tests:
    name: Swift 6.2 portable tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Show toolchain
        run: swift --version

      - name: Validate package manifest
        run: swift package dump-package >/dev/null

      - name: Run package tests
        run: swift test

  ios-demo:
    name: Build iOS Demo
    runs-on: macos-26
    needs: package-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Demo project
        working-directory: Examples/Demo
        run: xcodegen generate --spec project.yml

      - name: Build iOS Demo
        working-directory: Examples/Demo
        run: |
          xcodebuild \
            -project Demo.xcodeproj \
            -scheme Demo \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
