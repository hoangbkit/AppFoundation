name: Demo Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mycli-demo-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Demo
    runs-on: macos-26

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Demo project
        working-directory: Examples/Demo
        run: xcodegen generate --spec project.yml

      - name: Set build release tag
        id: release
        shell: bash
        run: |
          tag="mycli-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Build release: $tag"

      - name: Archive unsigned iOS Demo
        shell: bash
        working-directory: Examples/Demo
        run: |
          IOS_DERIVED="$RUNNER_TEMP/AppFoundationDemo-iOS"
          IOS_ARCHIVE="$RUNNER_TEMP/AppFoundationDemo.xcarchive"
          SOURCE_PACKAGES="$RUNNER_TEMP/AppFoundationDemo-SourcePackages"
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"

          args=(
            -project Demo.xcodeproj
            -scheme Demo
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$IOS_DERIVED"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -archivePath "$IOS_ARCHIVE"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            archive
          )
          xcodebuild "${args[@]}"

          test -d "$IOS_ARCHIVE"
          IOS_APP_COUNT="$(find "$IOS_ARCHIVE/Products/Applications" -maxdepth 1 -type d -name '*.app' -print | wc -l | tr -d ' ')"
          if [[ "$IOS_APP_COUNT" != "1" ]]; then
            echo "error: expected exactly one iOS app in archive, found $IOS_APP_COUNT" >&2
            exit 1
          fi

          mkdir -p "$ARTIFACTS"
          ditto -c -k --sequesterRsrc --keepParent             "$IOS_ARCHIVE"             "$ARTIFACTS/AppFoundationDemo-iOS-unsigned-${{ steps.release.outputs.tag }}.xcarchive.zip"

          rm -rf "$IOS_DERIVED" "$IOS_ARCHIVE"

      - name: Verify release archive
        shell: bash
        run: |
          ls -lh artifacts

          archive="artifacts/AppFoundationDemo-iOS-unsigned-${{ steps.release.outputs.tag }}.xcarchive.zip"
          test -f "$archive"

          bytes="$(stat -f%z "$archive")"
          if (( bytes >= 2147483648 )); then
            echo "error: $archive is too large for a GitHub Release asset" >&2
            exit 1
          fi

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip             --target "$RELEASE_SHA"             --title "$RELEASE_TAG"             --prerelease             --generate-notes
