name: Fast CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on iOS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package >/dev/null

      # Fast CI is manually dispatched only and runs the full package test suite
      # on a concrete simulator. The job timeout bounds unusually long test runs.
      - name: Select an available iOS 26 simulator
        run: |
          xcrun simctl list devices available --json > /tmp/fast-ci-simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          with open('/tmp/fast-ci-simulators.json') as source:
              devices = json.load(source)['devices']
          for runtime, candidates in devices.items():
              if 'iOS-26-' not in runtime and not runtime.endswith('iOS-26-0'):
                  continue
              phone = next((device for device in candidates if device['name'].startswith('iPhone')), None)
              if phone:
                  print('TEST_SIMULATOR_ID=' + phone['udid'])
                  break
          else:
              raise SystemExit('No available iOS 26 iPhone simulator')
          PY

      - name: Run package tests on iOS Simulator
        run: |
          xcodebuild test \
            -scheme AppFoundation-Package \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Demo project
        working-directory: Examples/Demo
        run: xcodegen generate --spec project.yml

      - name: Build iOS Demo
        working-directory: Examples/Demo
        run: |
          xcodebuild \
            -project Demo.xcodeproj \
            -scheme Demo \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
