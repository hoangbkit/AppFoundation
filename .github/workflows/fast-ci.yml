name: Fast CI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build on iOS
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package >/dev/null

      # Package test execution is intentionally disabled for now. The async/keychain
      # suites can wedge the simulator runner and make Fast CI take many minutes.
      # Compile the test bundle so test-source errors are still caught.
      - name: Build tests for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -scheme AppFoundation-Package \
            -destination "generic/platform=iOS Simulator"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Demo project
        working-directory: Examples/Demo
        run: xcodegen generate --spec project.yml

      - name: Build iOS Demo
        working-directory: Examples/Demo
        run: |
          xcodebuild \
            -project Demo.xcodeproj \
            -scheme Demo \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
